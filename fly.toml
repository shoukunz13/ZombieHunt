# fly.toml app configuration file generated for zombiehunt-shou-frosty-frost-4822 on 2026-01-27T20:02:20+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zombiehunt-shou'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  NODE_ENV = 'production'
  # Allow the Fly app origin for Socket.io / API CORS
  ALLOWED_ORIGINS = 'https://zombiehunt-shou.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
